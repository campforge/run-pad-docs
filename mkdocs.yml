# User documentation published to GitHub Pages (https://campforge.github.io/run-pad-docs/).
# Only docs/site is published.
# Build locally: see docs/GITHUB-PAGES.md.
site_name: RunPad
site_description: User guide for RunPad, a desktop scratchpad for C# and Visual Basic scripts.
site_url: https://campforge.github.io/run-pad-docs/
copyright: Copyright &copy; 2026 Vadim (hobobyte). RunPad is licensed under GPL-3.0.

docs_dir: docs/site
site_dir: site

nav:
  - Overview: index.md
  - Getting started:
      - Installation: install.md
      - Quick start: quick-start.md
      - Examples: examples.md
  - Using RunPad:
      - Scripts and .rpad files: scripts.md
      - Editor: editor.md
      - Diagnostics and analyzers: analyzers.md
      - Debugging: debugging.md
      - Results and runtime helpers: results.md
      - Packages and references: dependencies.md
      - Assembly Explorer: assembly-explorer.md
      - Command line and LINQPad import: cli.md
  - Reference: reference.md

theme:
  name: material
  language: en
  # No web fonts: the theme falls back to the system font stack, so pages make no
  # third-party font requests.
  font: false
  logo: assets/app-icon.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  # Footer link back to the Campforge home page (icon bundled with the theme, no external request).
  social:
    - icon: material/home-outline
      link: https://campforge.github.io/
      name: Campforge
  generator: false

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  not_found: warn
